name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The critical signal: evaluate every flake output (catches module-option
  # typos and niri-settings schema errors) without building anything.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate flake (no build)
        run: nix flake check --no-build --all-systems

  # Style + hygiene. Kept separate so a formatting nit doesn't hide the eval
  # result (and vice versa).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Formatting (alejandra)
        run: nix run nixpkgs#alejandra -- --check .
      - name: Lint (statix)
        run: nix run nixpkgs#statix -- check .
      - name: Dead code (deadnix)
        run: nix run nixpkgs#deadnix -- --fail .

  # Realise every configuration. niri + noctalia are prebuilt from cachix for
  # michal-pc. Runs on main / manual dispatch.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: michal-pc
            runner: ubuntu-latest
            attr: nixosConfigurations.michal-pc.config.system.build.toplevel
          - name: DPF664KK9
            runner: ubuntu-latest
            attr: nixosConfigurations.DPF664KK9.config.system.build.toplevel
          - name: michal-macbook
            runner: macos-latest
            attr: darwinConfigurations.michal-macbook.system
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra-nix-conf: |
            substituters = https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            extra-substituters = https://niri-epireyn.cachix.org https://noctalia.cachix.org
            extra-trusted-public-keys = niri-epireyn.cachix.org-1:tlVyFN7CtsDT+ZcLPS+ekFWeT1X6X4OqvWqbBMyIzFA= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
      - name: Build ${{ matrix.name }}
        run: |
          nix build --print-build-logs \
            '.#${{ matrix.attr }}'

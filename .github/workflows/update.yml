name: update

on:
  schedule:
    # Weekly on Sunday.
    - cron: '0 0 * * 5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Resolve latest inputs once (cheap), share the resulting flake.lock via
  # artifact so build jobs all see the same update and we don't race.
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix flake update
        run: nix flake update 2>&1 | tee flake-update.log
      - name: Upload flake.lock + summary log
        uses: actions/upload-artifact@v4
        with:
          name: flake-update
          path: |
            flake.lock
            flake-update.log

  # Rebuild every config against the fresh lock. Fail the job (and thus skip
  # the commit) if any build fails. fail-fast so the matrix stops early.
  build:
    needs: update
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: michal-pc
            runner: ubuntu-latest
            attr: nixosConfigurations.michal-pc.config.system.build.toplevel
          - name: DPF664KK9
            runner: ubuntu-latest
            attr: nixosConfigurations.DPF664KK9.config.system.build.toplevel
          - name: michal-macbook
            runner: macos-latest
            attr: darwinConfigurations.michal-macbook.system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flake-update
          path: .
      - uses: cachix/install-nix-action@v31
        with:
          extra-nix-conf: |
            substituters = https://cache.nixos.org/ https://niri-epireyn.cachix.org https://noctalia.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= niri-epireyn.cachix.org-1:tlVyFN7CtsDT+ZcLPS+ekFWeT1X6X4OqvWqbBMyIzFA= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
      - name: Build ${{ matrix.name }}
        run: |
          nix build --print-build-logs \
            '.#${{ matrix.attr }}'

  # Only on success of the builds. Pushes directly to the branch (main for
  # schedules).
  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flake-update
          path: .
      - name: Commit if anything changed
        run: |
          if git diff --quiet flake.lock; then
            echo "No changes to flake.lock."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          {
            echo "flake: update"
            echo
            cat flake-update.log
          } | git commit -F-
          git push
